{% extends "base.html" %}

{% block title %}Servers{% endblock %}

{% block content %}
  <h1>Servers</h1>
  <p class="lede">Names come from the config file. CPU is read on this machine.</p>
  <section class="cards" aria-label="Servers">
    {% for server in servers %}
      <article class="card">
        <div class="card-head">
          <h2>{{ server.name }}</h2>
          <span class="pill">Local</span>
        </div>
        <dl>
          <div>
            <dt>Host</dt>
            <dd>{{ server.host }}</dd>
          </div>
        </dl>
        <a class="cpu-link" href="{{ url_for('cpu', server_id=server.id) }}">CPU</a>
      </article>
    {% endfor %}
  </section>
{% endblock %}
